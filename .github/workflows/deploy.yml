name: Deploy Lamp services

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging]
        required: true
  push:
    tags: ["prod-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/prod-v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify production tag signature
        if: startsWith(github.ref, 'refs/tags/prod-v')
        run: |
          printf '%s' "${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}" | gpg --import
          git verify-tag "${GITHUB_REF_NAME}"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Apply additive migrations
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Build and publish Agent Core
        run: gcloud builds submit agent-core --tag "${{ vars.AGENT_CORE_IMAGE }}:${GITHUB_SHA}"
      - name: Deploy immutable Cloud Run revision
        run: |
          gcloud run deploy lamp-agent-core \
            --image "${{ vars.AGENT_CORE_IMAGE }}:${GITHUB_SHA}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --service-account "${{ vars.AGENT_CORE_RUNTIME_SERVICE_ACCOUNT }}" \
            --port 8080 --concurrency 40 --timeout 60 --min 1 --max 20 \
            --set-env-vars "NODE_ENV=${{ startsWith(github.ref, 'refs/tags/prod-v') && 'production' || 'staging' }}" \
            --set-env-vars "ENABLE_AUTO_COMMIT=false,ENABLE_DEBUG_ENDPOINTS=${{ startsWith(github.ref, 'refs/tags/prod-v') && 'false' || 'true' }}" \
            --set-env-vars "SUPABASE_URL=${{ vars.SUPABASE_URL }}" \
            --set-env-vars "DEFAULT_MODEL=${{ vars.DEEPSEEK_FLASH_MODEL }},COMPLEX_MODEL=${{ vars.DEEPSEEK_PRO_MODEL }}" \
            --set-env-vars "ALLOWED_DEEPSEEK_MODELS=${{ vars.DEEPSEEK_FLASH_MODEL }}\,${{ vars.DEEPSEEK_PRO_MODEL }}" \
            --set-env-vars "OTEL_SERVICE_NAME=lamp-agent-core,OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf" \
            --set-env-vars "OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
            --set-secrets "DEEPSEEK_API_KEY=lamp-deepseek-api-key:latest,SUPABASE_SERVICE_ROLE_KEY=lamp-supabase-service-role:latest,CONFIRMATION_HMAC_SECRET=lamp-confirmation-hmac:latest,AGENT_CORE_SERVICE_TOKEN=lamp-edge-core-token:latest" \
            --allow-unauthenticated
      - name: Configure Edge-to-Core secrets
        run: |
          CORE_URL="$(gcloud run services describe lamp-agent-core --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          EDGE_TOKEN="$(gcloud secrets versions access latest --secret=lamp-edge-core-token)"
          supabase secrets set \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            AGENT_CORE_URL="${CORE_URL}" \
            AGENT_CORE_SERVICE_TOKEN="${EDGE_TOKEN}" \
            USER_CONTENT_BUCKET="${{ vars.USER_CONTENT_BUCKET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy v2 Edge proxy
        run: |
          supabase functions deploy proposals --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy account --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Staging or production smoke gate
        run: ./scripts/staging-smoke.sh "${{ vars.PUBLIC_SUPABASE_FUNCTION_URL }}"
        env:
          STAGING_USER_JWT: ${{ secrets.SMOKE_USER_JWT }}
          STAGING_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SMOKE_MODE: ${{ startsWith(github.ref, 'refs/tags/prod-v') && 'reachability' || 'full' }}
      - name: Staging Debug Trace and Replay gate
        if: ${{ !startsWith(github.ref, 'refs/tags/prod-v') }}
        run: |
          CORE_URL="$(gcloud run services describe lamp-agent-core --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          EDGE_TOKEN="$(gcloud secrets versions access latest --secret=lamp-edge-core-token)"
          AGENT_CORE_SERVICE_TOKEN="${EDGE_TOKEN}" node scripts/staging-debug-smoke.mjs "${CORE_URL}"
        env:
          STAGING_USER_JWT: ${{ secrets.SMOKE_USER_JWT }}
